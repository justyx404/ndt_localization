/**:
  ros__parameters:
    # Frame IDs
    odom_frame_id: "odom_lidar"
    base_frame_id: "base_link"
    map_frame_id:  "map"

    # NDT Parameters
    localization:
      ndt_resolution: 1.0
      ndt_step_size: 0.1
      ndt_trans_epsilon: 0.005
      ndt_max_iter: 15

      # Phase 2 deterministic workload bounds.
      ndt_map_leaf_size: 0.15
      ndt_scan_leaf_size: 0.0
      local_map_radius_m: 35.0
      max_local_map_points: 120000
      min_local_map_points: 1000
      max_scan_points: 4000
      registration_deadline_ms: 80.0
      deadline_watchdog_margin_ms: 1.0
      ndt_log_runtime: false
      # Computing PCL's full fitness score adds a separate O(scan points) pass.
      ndt_compute_fitness_score: false
      publish_scan_diagnostics: true

      # Phase 1 synchronization and input validation.
      odom_buffer_duration_seconds: 3.0
      odom_buffer_max_samples: 500
      max_odom_interpolation_gap_seconds: 0.15
      max_odometry_age_seconds: 0.5
      max_scan_age_seconds: 0.5
      max_initial_pose_age_seconds: 1.0
      future_tolerance_seconds: 0.1
      quaternion_norm_tolerance: 0.001
      covariance_symmetry_tolerance: 0.000001
      covariance_psd_tolerance: 0.000000001
      max_initial_position_stddev_m: 10.0
      max_initial_yaw_stddev_deg: 180.0

      # A prior and registration result remain unpublished until three
      # consecutive candidate corrections agree.
      initialization_confirmation_scans: 3
      max_result_translation_delta_m: 1.0
      max_result_rotation_delta_deg: 20.0
      max_confirmation_translation_delta_m: 0.5
      max_confirmation_rotation_delta_deg: 10.0
      max_consecutive_rejections: 10
