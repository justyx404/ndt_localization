/**:
  ros__parameters:
    # Frame IDs
    odom_frame_id: "odom_lidar"
    base_frame_id: "base_link"
    map_frame_id:  "map"

    # NDT Parameters
    localization:
      ndt_resolution: 1.0
      ndt_step_size: 0.1
      ndt_trans_epsilon: 0.005
      ndt_max_iter: 30
      # Zero preserves the untouched baseline. Benchmark/tuned configurations
      # must set these explicitly when filtering is under test.
      ndt_map_leaf_size: 0.0
      ndt_scan_leaf_size: 0.0
      ndt_log_runtime: false
      # Computing PCL's full fitness score adds a separate O(scan points)
      # pass. Keep it disabled for untouched matcher timing baselines.
      ndt_compute_fitness_score: false
      publish_scan_diagnostics: true
